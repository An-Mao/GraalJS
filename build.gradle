import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar
plugins {
    id "com.gradleup.shadow" version "9.4.1"
    id 'java'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[7.0.17,8.0)'
}

version = mod_version
group = mod_group_id
base {
    archivesName = mod_id
}
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

def nonJar = configurations.create('nonJar')





minecraft {
    mappings channel: mapping_channel, version: mapping_version
    accessTransformer = true
    runs {
        configureEach {
            workingDir.convention layout.projectDirectory.dir('run')
            //systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
            //args "-mixin.config=mixins.${mod_id}.json"
        }
        register('client')
        register('server') {
            args '--nogui'
        }
        register('gameTestServer')

        register('data') {
            workingDir = layout.projectDirectory.dir('run-data')

            args '--mod', mod_id, '--all', '--output', layout.projectDirectory.dir('src/generated/resources'), '--existing', layout.projectDirectory.dir('src/main/resources')
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir layout.projectDirectory.dir('src/generated/resources') }


// This is necessary to make the dependencies in `nonJar` available at compile time.
// If you don't need that, you can skip this step.
configurations.compileClasspath {
    extendsFrom nonJar
}

configurations {
    minecraftLibrary
    implementation.extendsFrom minecraftLibrary
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
    mavenLocal()
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:$minecraft_version-$forge_version")
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.1'

    minecraftLibrary "org.graalvm.polyglot:polyglot:25.0.2"
    minecraftLibrary 'org.graalvm.js:js-language:25.0.2'
    minecraftLibrary 'org.graalvm.truffle:truffle-runtime:25.0.2'

    //add('nonJar', minecraftLibrary('org.graalvm.js:js-community:25.0.2'))
    //minecraftLibrary "org.graalvm.polyglot:js-community:25.0.2"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
tasks.named('processResources', ProcessResources) {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.property('replaceProperties', replaceProperties)

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : version,
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : version,
                'Implementation-Vendor'   : mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
        //attributes['MixinConfigs'] = "${mod_id}.mixins.json"
    }
    //archiveClassifier = 'slim'
}


tasks.shadowJar {
    from(nonJar)
    archiveBaseName.set(mod_id)
    archiveClassifier.set("all")
    mergeServiceFiles()
    from sourceSets.main.output
    configurations = [
            project.configurations.minecraftLibrary
    ]
    dependencies {
        exclude(dependency("org.graalvm.js:js-community:.*"))
        exclude(dependency("org.graalvm.js:js:.*"))
    }
}

tasks.register('shadowJarLite', ShadowJar) {
    from(nonJar)
    archiveBaseName.set(mod_id)
    archiveClassifier.set("lite")
    mergeServiceFiles()
    from sourceSets.main.output
    configurations = [
            project.configurations.minecraftLibrary
    ]

    dependencies {
        exclude(dependency("org.graalvm.js:js-community:.*"))
        exclude(dependency("org.graalvm.js:js:.*"))
        exclude(dependency("org.graalvm.sdk:collections:.*"))
        exclude(dependency("org.graalvm.sdk:word:.*"))
        exclude(dependency("org.graalvm.sdk:nativeimage:.*"))
        exclude(dependency("org.graalvm.truffle:truffle-compiler:.*"))
    }

}
tasks.named("build") {
    dependsOn shadowJar
    dependsOn shadowJarLite
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = mod_id
            from components.java
        }
    }
    repositories {
        mavenLocal()
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/An-Mao/JavaRepo")
            credentials {
                username = "An-Mao"
                password = "ghp_" + System.getenv("GTT")
            }
        }
    }
}